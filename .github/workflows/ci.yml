name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ruff pytest pydantic pyyaml networkx scikit-learn chromadb sentence-transformers

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

      - name: Run Pytest
        run: |
          pytest
