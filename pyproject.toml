[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "termsheet-ai"
version = "0.1.0"
description = "A Smart Legal Assistant for Startup Founders"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]
nlp = [
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "scikit-learn>=1.3.0",
]
parsing = [
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.0.0",
    "pytesseract>=0.3.10",
]
ui = [
    "streamlit>=1.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
]
ignore = [
    "E501", 
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
